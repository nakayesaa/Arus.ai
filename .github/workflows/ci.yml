name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: arus_ai_test
          POSTGRES_USER: arus
          POSTGRES_PASSWORD: arus_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arus -d arus_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      NEXT_PUBLIC_API_ORIGIN: http://localhost:4000
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://arus:arus_ci_only@localhost:5432/arus_ai_test?schema=public
      DIRECT_DATABASE_URL: postgresql://arus:arus_ci_only@localhost:5432/arus_ai_test?schema=public
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      DEMO_SEED_PASSWORD: ci-synthetic-password-only

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply committed migrations
        run: npm run db:migrate:deploy

      - name: Seed synthetic tenant fixtures
        run: npm run db:seed

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build production artifacts
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
