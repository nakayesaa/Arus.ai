name: arus-ai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arus_ai}
      POSTGRES_USER: ${POSTGRES_USER:-arus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arus_local_only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-arus} -d ${POSTGRES_DB:-arus_ai}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
